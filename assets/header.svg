<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440"><style>
 .s{font-family:'Barlow','D-DIN','DIN Alternate','DIN Next','Helvetica Neue','Inter','Segoe UI',Arial,sans-serif} .m{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
 .in{opacity:0;animation:in 1.1s cubic-bezier(.2,.7,.2,1) forwards}
 @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
 .grow{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0);animation:grow 1.4s cubic-bezier(.2,.7,.2,1) forwards}
 @keyframes grow{to{transform:scaleX(1)}}
 .pulse{animation:pulse 2.4s ease-in-out infinite} @keyframes pulse{50%{opacity:.25}}
</style>
<defs>
  <radialGradient id="limb" cx="50%" cy="0%" r="60%">
    <stop offset="0" stop-color="#1A2A3D"/><stop offset=".35" stop-color="#0B121B"/><stop offset="1" stop-color="#000"/>
  </radialGradient>
  <filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="10"/></filter>
  <linearGradient id="fadeR" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1200" height="440" fill="#000"/>

<!-- earth limb -->
<circle cx="930" cy="1430" r="1120" fill="none" stroke="#6FA8DC" stroke-opacity=".35" stroke-width="14" filter="url(#glow)"/>
<circle cx="930" cy="1430" r="1120" fill="url(#limb)"/>
<circle cx="930" cy="1430" r="1120" fill="none" stroke="url(#fadeR)" stroke-width="1.2"/>

<!-- ascent trajectory -->
<path id="traj" d="M 860 312 C 900 230, 980 140, 1200 70" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="1" stroke-dasharray="3 5"/>
<circle r="2.6" fill="#FFFFFF"><animateMotion dur="7s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines=".4 0 .6 1"><mpath href="#traj"/></animateMotion>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="7s" repeatCount="indefinite"/></circle>

<!-- top bar -->
<g class="in m" font-size="11" letter-spacing="3" fill="#8C8C8C">
  <text x="60" y="52" fill="#FFFFFF" font-weight="700">REMONTREE</text>
  <text x="1140" y="52" text-anchor="end" xml:space="preserve">PROPULSION     SIMULATION     MACHINE LEARNING</text>
</g>
<rect x="60" y="72" width="1080" height="1" fill="#262626" class="grow" style="animation-delay:.2s"/>

<!-- title -->
<g class="in" style="animation-delay:.35s">
  <text x="56" y="178" class="s" font-size="76" font-weight="700" fill="#FFFFFF" letter-spacing="10">LEE JONG WON</text>
</g>
<g class="in" style="animation-delay:.6s">
  <text x="60" y="222" class="s" font-size="16" font-weight="500" fill="#FFFFFF" letter-spacing="6">MACHINE LEARNING FOR AEROSPACE</text>
  <text x="60" y="250" class="s" font-size="13" font-weight="400" fill="#8C8C8C" letter-spacing="3" xml:space="preserve">KYUNG HEE UNIVERSITY  —  COMPUTER ENGINEERING × APPLIED PHYSICS</text>
</g>
<rect x="60" y="290" width="40" height="2" fill="#FFFFFF" class="grow" style="animation-delay:.9s"/>
<g class="in" style="animation-delay:1.00s"><text x="60" y="372" class="s" font-size="44" font-weight="300" fill="#FFFFFF">12</text><text x="62" y="396" class="s" font-size="11" font-weight="600" fill="#8C8C8C" letter-spacing="3">MISSIONS</text></g><g class="in" style="animation-delay:1.15s"><text x="210" y="372" class="s" font-size="44" font-weight="300" fill="#FFFFFF">09</text><text x="212" y="396" class="s" font-size="11" font-weight="600" fill="#8C8C8C" letter-spacing="3">AWARDS</text></g><g class="in" style="animation-delay:1.30s"><text x="360" y="372" class="s" font-size="44" font-weight="300" fill="#FFFFFF">01</text><text x="362" y="396" class="s" font-size="11" font-weight="600" fill="#8C8C8C" letter-spacing="3">PUBLICATION</text></g>

<!-- live status -->
<g class="in m" style="animation-delay:1.5s" font-size="10.5" letter-spacing="2.5">
  <circle cx="938" cy="402" r="3" fill="#FFFFFF" class="pulse"/>
  <text x="950" y="406" fill="#FFFFFF" textLength="190" lengthAdjust="spacing">ODYSSEY · IN PROGRESS</text>
</g>
</svg>