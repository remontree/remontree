<text x="0" y="54" class="sans" font-size="30" font-weight="800" fill="#7F8FA8" letter-spacing="-.5">FLIGHT PATH</text>
<g class="grow"><rect x="0" y="66" width="1200" height="1" fill="#1EA7DB" opacity=".25"/><rect x="0" y="65" width="90" height="3" fill="#1EA7DB"/></g>
<rect x="1190" y="10" width="8" height="8" fill="none" stroke="#1EA7DB" stroke-opacity=".6"/>
</svg>