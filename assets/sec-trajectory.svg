<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="70" viewBox="0 0 1200 70">
<style>.mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace} .sans{font-family:'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif}
 .grow{transform-box:fill-box;transform-origin:0 0;transform:scaleX(0);animation:g 1.4s cubic-bezier(.2,.8,.2,1) .2s forwards} @keyframes g{to{transform:scaleX(1)}}</style>
