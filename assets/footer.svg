<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150"><style>
 .s{font-family:'Barlow','D-DIN','DIN Alternate','DIN Next','Helvetica Neue','Inter','Segoe UI',Arial,sans-serif} .m{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
 .in{opacity:0;animation:in 1.1s cubic-bezier(.2,.7,.2,1) forwards}
 @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
 .grow{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0);animation:grow 1.4s cubic-bezier(.2,.7,.2,1) forwards}
 @keyframes grow{to{transform:scaleX(1)}}
 .pulse{animation:pulse 2.4s ease-in-out infinite} @keyframes pulse{50%{opacity:.25}}
</style>
<defs><filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="8"/></filter>
<linearGradient id="fadeR" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<rect width="1200" height="150" fill="#000"/>
<circle cx="600" cy="1360" r="1240" fill="none" stroke="#6FA8DC" stroke-opacity=".3" stroke-width="12" filter="url(#glow)"/>
<circle cx="600" cy="1360" r="1240" fill="#05080C"/>
<circle cx="600" cy="1360" r="1240" fill="none" stroke="url(#fadeR)" stroke-width="1"/>
<text x="600" y="62" text-anchor="middle" class="s in" font-size="15" font-weight="600" fill="#FFFFFF" letter-spacing="9">AD ASTRA PER ASPERA</text>
<text x="600" y="88" text-anchor="middle" class="m in" style="animation-delay:.3s" font-size="10" fill="#8C8C8C" letter-spacing="3" xml:space="preserve">REMONTREE  ·  END OF TRANSMISSION</text>
</svg>